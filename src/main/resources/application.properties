spring.application.name=sgva

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgva}
spring.datasource.username=${DB_USER:sgva}
spring.datasource.password=${DB_PASSWORD:sgva_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Ruta del archivo externo con las ponderaciones del modelo institucional de
# autoevaluacion (ver DESIGN_SGVA.md, reglas de calculo del resultado de
# autoevaluacion y carga de configuracion de ponderaciones). Sin valor por
# defecto: el investigador debe entregar el archivo y configurar esta
# propiedad antes de levantar la aplicacion.
sgva.ponderaciones.archivo=${SGVA_PONDERACIONES_ARCHIVO}

# Seguimiento del proceso institucional (V6, ver DESIGN_SGVA.md Seccion 0.1):
# umbrales del semaforo de participacion y dias para considerar una actividad
# "proxima a vencer". A diferencia de las ponderaciones, son un criterio del
# investigador (no de la fuente institucional), por lo que si tienen un valor
# por defecto.
sgva.seguimiento.umbral-rojo-naranja=${SGVA_UMBRAL_ROJO_NARANJA:0.6}
sgva.seguimiento.umbral-naranja-verde=${SGVA_UMBRAL_NARANJA_VERDE:0.8}
sgva.seguimiento.dias-proxima-a-vencer=${SGVA_DIAS_PROXIMA_A_VENCER:7}
