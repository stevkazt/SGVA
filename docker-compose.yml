services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: sgva
      POSTGRES_PASSWORD: sgva_dev_password
      POSTGRES_DB: sgva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgva -d sgva"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Backend y frontend solo se levantan con `docker compose up --build`
  # (para desarrollo basta `docker compose up -d db`, como indica el README).
  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
