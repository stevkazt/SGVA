version: "3.8"

services:
  db:
    image: postgres:16
    container_name: sgva-postgres
    restart: always
    environment:
      POSTGRES_USER: sgva
      POSTGRES_PASSWORD: sgva_dev_password
      POSTGRES_DB: sgva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
